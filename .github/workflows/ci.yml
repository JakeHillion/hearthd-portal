name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level so the Sign APK step's `if` guard can read them (a step's own
    # step-level env isn't reliably visible to that step's `if`).
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # Builds the APK and runs Android Lint (both are flake checks).
      - name: nix flake check
        run: nix flake check --print-build-logs

      # The APK was already built by the check above, so this just fetches it
      # from the store. Copy out of the read-only store for signing/upload
      # (the store path is read-only, and the copy is debug-signed by Nix).
      - name: Collect APK
        run: |
          out=$(nix build .#hearthd-portal --no-link --print-out-paths)
          mkdir -p artifacts
          cp "$out"/*.apk artifacts/
          chmod -R u+w artifacts

      # Re-sign the Nix-built APK with the stable release key so devices can be
      # updated in place later. Skipped when the signing secrets are absent
      # (e.g. pull requests from forks), which just leaves the debug signature.
      - name: Sign APK
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          for apk in artifacts/*.apk; do
            nix develop --command bash ci/sign-apk.sh "$apk" "$apk.signed"
            mv "$apk.signed" "$apk"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hearthd-portal-apk
          path: artifacts/*.apk
          if-no-files-found: error
